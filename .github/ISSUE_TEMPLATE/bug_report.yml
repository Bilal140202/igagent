name: Bug report
description: igagent behaved against its documented contract
labels: [bug]
body:
  - type: input
    id: version
    attributes: {label: igagent version, placeholder: "igagent 1.0.0"}
    validations: {required: true}
  - type: dropdown
    id: channel
    attributes:
      label: Invocation channel
      options: ["CLI", "MCP host", "subprocess (--json)", "other"]
    validations: {required: true}
  - type: dropdown
    id: stage
    attributes:
      label: Failed pipeline stage (see agent.md §5)
      options: ["discovery", "decoder", "fetcher", "orchestrator", "unknown"]
    validations: {required: true}
  - type: textarea
    id: input
    attributes:
      label: Input shape (never paste real URLs — mask the shortcode)
      placeholder: "instagram.com/p/<CODE>/"
    validations: {required: true}
  - type: textarea
    id: errors
    attributes:
      label: errors[] / stderr tail
      placeholder: 'Paste the errors array or last stderr lines'
    validations: {required: true}
