[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "igagent"
version = "1.0.0"
description = "Agentic Instagram post/carousel/reel harvester for AI agents — no login, no API keys, no browser. MCP wrapper included."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Bilal140202" }]
keywords = ["instagram", "agent", "ai-agents", "mcp", "model-context-protocol", "scraper", "media-downloader", "archiver", "cli", "harvester", "reels", "carousel"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Bilal140202/igagent"
Documentation = "https://github.com/Bilal140202/igagent#readme"
Repository = "https://github.com/Bilal140202/igagent"
Issues = "https://github.com/Bilal140202/igagent/issues"
Changelog = "https://github.com/Bilal140202/igagent/blob/main/RELEASE_NOTES.md"

[project.scripts]
igagent = "igagent:main"

[tool.setuptools]
packages = ["igagent"]
